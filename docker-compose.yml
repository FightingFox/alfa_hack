services:
  main-module:
    build: ./main-module
    container_name: main-module
    ports:
      - "8000:8000"
    environment:
      APP_ENV: production
      DEBUG: "false"
      HOST: 0.0.0.0
      PORT: 8000
      WORKERS: 4
      REDIS_URL: redis://redis:6379/0
      MASKING_SERVICES: '[{"name":"regex","protocol":"websocket","url":"ws://load-balancer/regex-module/scan","timeout":10.0,"pool":{"min_connections":4,"max_connections":64}},{"name":"llm","protocol":"rest","url":"http://load-balancer/llm-service/process","timeout":10.0},{"name":"gliner","protocol":"rest","url":"http://load-balancer/gliner-famous/process","timeout":10.0}]'
    depends_on:
      redis:
        condition: service_healthy
      load-balancer:
        condition: service_started
    restart: unless-stopped

  regex-module:
    build: ./regex-module
    container_name: regex-module
    expose:
      - "8000"
    restart: unless-stopped

  llm-service:
    build: ./llm_service
    container_name: llm-service
    env_file:
      - ./llm_service/.env.example
    expose:
      - "8000"
    restart: unless-stopped

  gliner-famous:
    build: ./gliner_famous
    container_name: gliner-famous
    expose:
      - "8000"
    restart: unless-stopped

  load-balancer:
    build: ./load_balanser
    container_name: load-balancer
    ports:
      - "8080:80"
    environment:
      GLINER_BACKENDS: "gliner-famous:8000"
      LLM_BACKENDS: "llm-service:8000"
      REGEX_BACKENDS: "regex-module:8000"
      MAIN_BACKENDS: "main-module:8000"
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: main-module-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

volumes:
  redis-data: