services:
  main-module-1:
    image: cr.yandex/crpjr8em43c2vgubc740/main-module:latest
    container_name: main-module-1
    environment:
      APP_ENV: production
      DEBUG: "false"
      HOST: 0.0.0.0
      PORT: 8000
      WORKERS: 4
      REDIS_URL: redis://redis:6379/0
      MASKING_SERVICES: '[{"name":"regex","protocol":"websocket","url":"ws://load-balancer/regex-module/scan","timeout":1.0,"pool":{"min_connections":4,"max_connections":64}},{"name":"llm","protocol":"rest","url":"http://load-balancer/llm-service/process","timeout":1.0},{"name":"gliner","protocol":"rest","url":"http://load-balancer/gliner-famous/process","timeout":1.0},{"name":"ml","protocol":"rest","url":"http://load-balancer/ml-for-all-types/process","timeout":1.0}]'
    depends_on:
      redis:
        condition: service_healthy
      load-balancer:
        condition: service_started
    restart: unless-stopped

  main-module-2:
    image: cr.yandex/crpjr8em43c2vgubc740/main-module:latest
    container_name: main-module-2
    environment:
      APP_ENV: production
      DEBUG: "false"
      HOST: 0.0.0.0
      PORT: 8000
      WORKERS: 4
      REDIS_URL: redis://redis:6379/0
      MASKING_SERVICES: '[{"name":"regex","protocol":"websocket","url":"ws://load-balancer/regex-module/scan","timeout":1.0,"pool":{"min_connections":4,"max_connections":64}},{"name":"llm","protocol":"rest","url":"http://load-balancer/llm-service/process","timeout":1.0},{"name":"gliner","protocol":"rest","url":"http://load-balancer/gliner-famous/process","timeout":1.0},{"name":"ml","protocol":"rest","url":"http://load-balancer/ml-for-all-types/process","timeout":1.0}]'
    depends_on:
      redis:
        condition: service_healthy
      load-balancer:
        condition: service_started
    restart: unless-stopped

  regex-module-1:
    image: cr.yandex/crpjr8em43c2vgubc740/regex-module:latest
    container_name: regex-module-1
    expose:
      - "8000"
    restart: unless-stopped

  regex-module-2:
    image: cr.yandex/crpjr8em43c2vgubc740/regex-module:latest
    container_name: regex-module-2
    expose:
      - "8000"
    restart: unless-stopped

  llm-service-1:
    image: cr.yandex/crpjr8em43c2vgubc740/llm-service:latest
    container_name: llm-service-1
    env_file:
      - ./llm_service.env
    expose:
      - "8000"
    restart: unless-stopped

  llm-service-2:
    image: cr.yandex/crpjr8em43c2vgubc740/llm-service:latest
    container_name: llm-service-2
    env_file:
      - ./llm_service.env
    expose:
      - "8000"
    restart: unless-stopped

  gliner-famous-1:
    image: cr.yandex/crpjr8em43c2vgubc740/gliner-famous:latest
    container_name: gliner-famous-1
    expose:
      - "8000"
    restart: unless-stopped

  gliner-famous-2:
    image: cr.yandex/crpjr8em43c2vgubc740/gliner-famous:latest
    container_name: gliner-famous-2
    expose:
      - "8000"
    restart: unless-stopped

  ml-for-all-types-1:
    image: cr.yandex/crpjr8em43c2vgubc740/ml-for-all-types:latest
    container_name: ml-for-all-types-1
    expose:
      - "8000"
    restart: unless-stopped

  ml-for-all-types-2:
    image: cr.yandex/crpjr8em43c2vgubc740/ml-for-all-types:latest
    container_name: ml-for-all-types-2
    expose:
      - "8000"
    restart: unless-stopped

  load-balancer:
    image: cr.yandex/crpjr8em43c2vgubc740/load-balancer:latest
    container_name: load-balancer
    ports:
      - "8080:80"
    environment:
      GLINER_BACKENDS: "gliner-famous-1:8000 gliner-famous-2:8000"
      LLM_BACKENDS: "llm-service-1:8000 llm-service-2:8000"
      REGEX_BACKENDS: "regex-module-1:8000 regex-module-2:8000"
      MAIN_BACKENDS: "main-module-1:8000 main-module-2:8000"
      ML_BACKENDS: "ml-for-all-types-1:8000 ml-for-all-types-2:8000"
    restart: unless-stopped

  load-balancer-exporter:
    image: nginx/nginx-prometheus-exporter:1.3.0
    container_name: load-balancer-exporter
    command:
      - -nginx.scrape-uri=http://load-balancer/nginx_status
    depends_on:
      - load-balancer
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: main-module-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    restart: unless-stopped

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.50.0
    container_name: cadvisor
    ports:
      - "8081:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    privileged: true
    devices:
      - /dev/kmsg
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.0.0
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  redis-data:
  prometheus-data:
  grafana-data: