services:
  main-module:
    build: ./main-module
    container_name: main-module
    ports:
      - "8000:8000"
    environment:
      APP_ENV: production
      DEBUG: "false"
      HOST: 0.0.0.0
      PORT: 8000
      WORKERS: 4
      REDIS_URL: redis://redis:6379/0
      MASKING_SERVICES: '[{"name":"regex","protocol":"websocket","url":"ws://regex-module:8000/scan","timeout":10.0,"pool":{"min_connections":4,"max_connections":64}},{"name":"llm","protocol":"rest","url":"http://llm-service:8000/process","timeout":10.0},{"name":"gliner","protocol":"rest","url":"http://gliner-famous:8000/process","timeout":10.0},{"name":"ml","protocol":"rest","url":"http://ml-for-all-types:8000/process","timeout":10.0}]'
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  regex-module:
    build: ./regex-module
    container_name: regex-module
    ports:
      - "8006:8000"
    restart: unless-stopped

  llm-service:
    build: ./llm_service
    container_name: llm-service
    env_file:
      - ./llm_service/.env
    ports:
      - "8003:8000"
    restart: unless-stopped

  gliner-famous:
    build: ./gliner_famous
    container_name: gliner-famous
    ports:
      - "8001:8000"
    restart: unless-stopped

  ml-for-all-types:
    build: ./ml_for_all_types
    container_name: ml-for-all-types
    ports:
      - "8005:8000"
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: main-module-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  prometheus:
    build: ./monitoring/prometheus
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - prometheus-data:/prometheus
    restart: unless-stopped

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: cadvisor
    ports:
      - "8081:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    privileged: true
    devices:
      - /dev/kmsg
    restart: unless-stopped

  grafana:
    build: ./monitoring/grafana
    container_name: grafana
    ports:
      - "3000:3000"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  redis-data:
  prometheus-data:
  grafana-data: